[package]
name = "music-player"
version = "0.1.0"
edition = "2024"

[dependencies]
evdev = { version = "0.13.2", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = { version = "0.2.189", optional = true }
minifb = { version = "0.28.0", optional = true }
mpd = "0.1.0"

[build-dependencies]
fontdue = "0.9"

[features]
default = ["desktop"]
debug = []
desktop = ["dep:minifb"]
raspberry = ["dep:evdev", "dep:libc"]
